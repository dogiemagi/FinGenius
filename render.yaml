services:
  - type: web
    name: fingenius
    runtime: python
    rootDir: NextGenMarketAnalyzer
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
